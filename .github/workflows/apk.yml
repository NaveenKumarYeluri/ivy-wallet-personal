name: Build Offline APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Optimized Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Optimized Release APK
        uses: actions/upload-artifact@v7
        with:
          name: IvyWallet-Personal-Optimized.apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: IvyWallet-Offline-Debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
